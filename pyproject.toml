[project]
name = "comfyui-dettato"
description = "KobiMusic Dettato multi-instrument audio-to-MIDI nodes: a custom loader for the four 28.1M-parameter stage models (transcriber, evidence repairer, grouper, drums) loaded at their released fp32 precision, plus piano-roll previews, MIDI/JSON writers, and an adapter to the native YuE2 ABC score for ComfyUI's built-in YuE2 song generator."
version = "0.4.3"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "huggingface_hub>=1.0",
    "safetensors",
    "soxr>=0.3",
    "scipy",
    "pretty_midi>=0.2",
    "tqdm",
]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Apple Metal",
]

[project.urls]
Repository = "https://github.com/StanShumsky/ComfyUI-Dettato"

[tool.comfy]
PublisherId = "shumsky"
DisplayName = "ComfyUI-Dettato"
Icon = "https://raw.githubusercontent.com/StanShumsky/ComfyUI-Dettato/main/icon.png"
# V3 nodes (comfy_api.latest) need >=0.3.48; the search_aliases field >=0.11.0;
# the newest of the three is the real floor.
requires-comfyui = ">=0.11.0"

# Registry/manager-side model installation, alongside the in-node auto-download (the subfolder
# name of each repo matches the stage layout the loader expects).
[[tool.comfy.Models]]
location = "dettato"
model_url = "https://huggingface.co/kobimusic/dettato"

[[tool.comfy.Models]]
location = "dettato"
model_url = "https://huggingface.co/kobimusic/dettato-evidence"

[[tool.comfy.Models]]
location = "dettato"
model_url = "https://huggingface.co/kobimusic/dettato-grouper"

[[tool.comfy.Models]]
location = "dettato"
model_url = "https://huggingface.co/kobimusic/dettato-drums"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: prepend mode imports the repo-root __init__.py as a test module.
addopts = "--import-mode=importlib"
markers = ["integration: loads real weights; opt in with RUN_DET_WEIGHTS=1"]